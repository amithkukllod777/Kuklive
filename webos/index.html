<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, user-scalable=no" />
  <title>Kuklive</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --surface: #15151F;
      --surface2: #1F1F2B;
      --brand: #7C5CFF;
      --brand2: #FF5C8A;
      --fg: #F5F5F7;
      --muted: #A1A1AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    /* Overscan-safe padding for TV */
    #app { width: 100%; height: 100%; padding: 3.5vh 4vw; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    header .logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--brand); display: flex; align-items: center; justify-content: center;
    }
    header .logo::after {
      content: ""; width: 0; height: 0;
      border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
      margin-left: 4px;
    }
    header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
    header .count { margin-left: auto; color: var(--muted); font-size: 20px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar input, .toolbar select, .toolbar button {
      background: var(--surface); color: var(--fg); border: 2px solid transparent;
      border-radius: 12px; padding: 12px 16px; font-size: 20px; outline: none;
    }
    .toolbar input { flex: 1 1 320px; min-width: 220px; }
    .toolbar select { min-width: 150px; cursor: pointer; }
    .toolbar button { cursor: pointer; }
    .toolbar input:focus, .toolbar select:focus, .toolbar button:focus,
    .tile:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.45);
    }
    .tile:focus { transform: scale(1.06); }

    #grid {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px; align-content: start; padding-bottom: 20px;
    }
    .tile {
      background: var(--surface); border-radius: 16px; padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      border: 2px solid transparent;
    }
    .tile .logo {
      width: 84px; height: 84px; border-radius: 12px; background: var(--surface2);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .tile .logo img { max-width: 100%; max-height: 100%; }
    .tile .logo .ph { color: var(--brand); font-size: 30px; }
    .tile .name {
      font-size: 18px; text-align: center; line-height: 1.25; height: 46px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--muted); }
    .state .spinner {
      width: 54px; height: 54px; border: 6px solid rgba(124,92,255,.25); border-top-color: var(--brand);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state button {
      background: var(--brand); color: #fff; border: none; border-radius: 12px;
      padding: 12px 28px; font-size: 20px; cursor: pointer;
    }
    .state button:focus { outline: 3px solid #fff; }

    /* Player overlay */
    #player {
      position: fixed; inset: 0; background: #000; display: none; z-index: 50;
    }
    #player.open { display: block; }
    #player video { width: 100%; height: 100%; background: #000; object-fit: contain; }
    #player .bar {
      position: absolute; left: 0; right: 0; padding: 24px 40px;
      background: linear-gradient(rgba(0,0,0,.75), transparent);
      display: flex; align-items: center; gap: 16px; font-size: 24px;
    }
    #player .bar.top { top: 0; }
    #player .bar.bottom { bottom: 0; top: auto; background: linear-gradient(transparent, rgba(0,0,0,.75)); justify-content: center; }
    #player .pinfo { font-weight: 700; }
    #player .psub { color: var(--muted); font-size: 18px; }
    #player .err {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; font-size: 22px; text-align: center; padding: 40px;
    }
    .hint { color: var(--muted); font-size: 16px; padding: 6px 2px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo"></div>
      <h1>Kuklive</h1>
      <div class="count" id="count"></div>
    </header>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search channels" />
      <select id="fCategory"><option value="">All Categories</option></select>
      <select id="fCountry"><option value="">All Countries</option></select>
      <select id="fLanguage"><option value="">All Languages</option></select>
      <button id="reload">Reload</button>
    </div>

    <div id="grid"></div>
    <div class="state" id="state" style="display:none"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="player">
    <video id="video" playsinline></video>
    <div class="bar top">
      <span id="pName" class="pinfo"></span>
      <span id="pPos" class="psub"></span>
    </div>
    <div class="bar bottom">
      <span class="psub">◀ / ▶ change channel&nbsp;&nbsp;·&nbsp;&nbsp;Back to exit</span>
    </div>
    <div class="err" id="pErr"></div>
  </div>

  <script src="hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
